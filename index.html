<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>微光小鎮·二戰 RTS 實驗線</title>
  <style>
    /* R128：獨立模式入口與控制列；DOM 不增加 WebGL 呼叫。 */
    #sb-enter, #sandbox-panel button { box-sizing: border-box; min-width: 44px; min-height: 44px; border: 1px solid #6c745f; border-radius: 5px; background: #3c4535; color: #f3eedf; font: inherit; padding: 6px 10px; touch-action: manipulation; cursor: pointer; }
    #sb-enter { position: fixed; z-index: 6; left: max(8px, env(safe-area-inset-left)); top: calc(max(8px, env(safe-area-inset-top)) + 58px); }
    #sandbox-panel { position: fixed; z-index: 6; left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); box-sizing: border-box; padding: 8px; border: 1px solid #4f6f96; border-radius: 6px; background: rgba(24, 34, 48, .95); max-height: 45vh; overflow-y: auto; }
    #sandbox-panel .sb-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
    #sandbox-panel strong { flex: 1 1 100%; }
    #sandbox-panel button[aria-pressed="true"] { background: #9a4a2e; border-color: #d0835f; }
    #sb-enter[hidden], #sandbox-panel[hidden] { display: none; }
    #sb-hint { font-size: 13px; overflow-wrap: anywhere; }
    @media (max-width: 640px) { #sb-enter { top: calc(max(8px, env(safe-area-inset-top)) + 100px); } }
    @media (max-width: 411px) { #hud.cover-durability ~ #sb-enter { top: calc(max(8px, env(safe-area-inset-top)) + 148px); } }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #2a3329; color: #f3eedf;
      font: 14px/1.4 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    canvas { display: block; touch-action: none; image-rendering: pixelated; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #hud .bar { position: absolute; display: flex; gap: 6px; align-items: center; padding: 6px 8px;
      background: rgba(28, 32, 26, 0.72); border-radius: 6px; pointer-events: auto; }
    #hud .top { top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); gap: 12px; }
    #hud .top, #hud .bottom { pointer-events: none; }   /* 只有字的條不擋地圖上的點擊 */
    #hud .title { font-weight: 700; letter-spacing: 0.02em; }
    #hud .title small { opacity: 0.6; font-weight: 400; }
    #hud .btns { top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); }
    /* R117：只有音效鍵存在才用 4px 間距；八鍵 396px，觸控目標仍為 44px。 */
    #hud.has-audio .btns { gap: 4px; }
    #hud .bottom { left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); font-size: 13px; }
    #hud button { min-width: 44px; height: 36px; border: 1px solid #6c745f; border-radius: 5px; background: #3c4535;
      color: #f3eedf; font: inherit; cursor: pointer; }
    /* R107 彈種：七顆按鈕合計 360px，412px 手機保留兩側空間。 */
    #hud .btns button { box-sizing: border-box; width: 44px; height: 44px; padding: 0; flex: 0 0 44px; }
    #hud button.on { background: #9a4a2e; border-color: #d0835f; }
    #banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); padding: 14px 28px;
      font-size: 32px; font-weight: 800; background: rgba(20, 22, 18, 0.82); border: 2px solid #c9a650; border-radius: 8px; }
    /* R109：額外的選取框與一次性砲擊選單，DOM 不增加 WebGL 繪製。 */
    #selection-box { position: fixed; box-sizing: border-box; pointer-events: none; z-index: 5; border: 1px solid #c8d8ee; background: rgba(80, 130, 175, 0.18); }
    #selection-box[hidden], #command-menu[hidden] { display: none; }
    #command-menu { position: fixed; z-index: 15; box-sizing: border-box; width: 196px; max-width: calc(100vw - 16px); padding: 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: auto; touch-action: manipulation; background: rgba(24, 28, 22, 0.96); border: 1px solid #9eb38a; border-radius: 7px; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
    #command-menu strong { font-size: 13px; text-align: center; }
    #command-menu button { box-sizing: border-box; min-width: 44px; width: 100%; height: 44px; min-height: 44px; padding: 0 10px; border: 1px solid #6c745f; border-radius: 5px; background: #3c4535; color: #f3eedf; font: inherit; cursor: pointer; }
    /* R006 布陣列：貼在提示列上方（bottom 由 src/ui/build.ts 依提示列高度設定） */
    #hud.build #b-pause, #hud.build #b-speed, #hud.build #b-fire, #hud.build #b-ammo { display: none; }
    #buildbar { left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); bottom: 52px;
      flex-direction: column; align-items: stretch; gap: 6px; background: rgba(24, 34, 48, 0.86); border: 1px solid #4f6f96; }
    #buildbar[hidden] { display: none; }
    #buildbar .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    #buildbar #bb-trenches[hidden] { display: none; }
    #buildbar #bb-trenches button { flex: 1; padding: 0 6px; }
    #buildbar #bb-walls[hidden] { display: none; }
    #buildbar #bb-walls button { flex: 1; padding: 0 6px; }
    #buildbar button { min-height: 44px; min-width: 52px; padding: 0 10px; }
    #bb-detail { font-size: 12px; color: #ded4c0; line-height: 1.4; }
    #bb-detail[hidden] { display: none; }
    #buildbar button b { margin-left: 4px; color: #ffd36a; font-weight: 800; }
    #buildbar button.sel { background: #2f5f9a; border-color: #9cc6ff; box-shadow: inset 0 0 0 1px #9cc6ff; }
    #buildbar button.dim { opacity: 0.45; }
    #buildbar #bb-start { margin-left: auto; min-width: 96px; background: #9a4a2e; border-color: #e0a07a; font-weight: 800; letter-spacing: 0.1em; }
    #buildbar #bb-left { font-weight: 700; }
    #buildbar .pips { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
    #buildbar .pips i { width: 9px; height: 12px; border-radius: 2px; background: #3a4352; display: inline-block; }
    #buildbar .pips i.on { background: #ffd36a; }
    /* R010 戰報 */
    #report { z-index: 20; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto; background: rgba(10, 12, 9, 0.45); }
    #report[hidden], #report-open[hidden] { display: none; }
    #report .panel { box-sizing: border-box; width: min(92vw, 460px); max-height: 86vh; overflow: auto; padding: 16px 18px; background: rgba(24, 28, 22, 0.94); border: 2px solid #c9a650; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
    #report.lose .panel { border-color: #b8553a; } #report.draw .panel { border-color: #8f8f86; }
    #report h2 { margin: 0 0 4px; font-size: 34px; letter-spacing: 0.2em; text-align: center; color: #f2d58a; }
    #report.lose h2 { color: #f09a7a; } #report.draw h2 { color: #d8d4c8; }
    #report .time, #report .town { text-align: center; margin: 6px 0; font-size: 14px; }
    #report table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }
    #report th { text-align: left; font-weight: 600; color: #c8c2b0; padding: 4px 6px; white-space: nowrap; }
    #report td { padding: 4px 6px; border-top: 1px solid #3a4234; }
    #report tr:first-child td { border-top: none; color: #c8c2b0; font-weight: 700; }
    #report .acts { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
    #report .acts button { min-height: 44px; min-width: 110px; font-weight: 700; }
    #report #rp-again { background: #9a4a2e; border-color: #e0a07a; }
    #report-open { position: absolute; left: 50%; transform: translateX(-50%); bottom: 64px; pointer-events: auto; min-height: 44px; min-width: 96px; font-weight: 700; }
    /* R013 說明面板 */
    #help { z-index: 30; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto; background: rgba(10, 12, 9, 0.5); }
    #help[hidden] { display: none; }
    #help .panel { box-sizing: border-box; display: flex; flex-direction: column; width: min(92vw, 520px); max-height: 84vh; overflow: hidden; padding: 14px 18px; background: rgba(24, 28, 22, 0.95); border: 2px solid #6c8fb8; border-radius: 10px; font-size: 14px; line-height: 1.55; }
    #help .help-copy { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    #help h2 { margin: 0 0 6px; font-size: 22px; text-align: center; letter-spacing: 0.15em; }
    #help h3 { margin: 10px 0 4px; font-size: 15px; color: #c8d8ee; }
    #help ol, #help ul { margin: 4px 0; padding-left: 1.3em; } #help li { margin: 3px 0; } #help p { margin: 4px 0; }
    #help .acts { display: flex; flex-shrink: 0; justify-content: center; margin-top: 10px; }
    #help .acts button { min-height: 44px; min-width: 120px; font-weight: 700; background: #2f5f9a; border-color: #9cc6ff; }
    /* R015 小地圖：右上、按鈕列下面（手機在標題列下面） */
    #minimap { position: absolute; right: max(8px, env(safe-area-inset-right)); top: calc(max(8px, env(safe-area-inset-top)) + 58px); pointer-events: auto;
      background: rgba(20, 24, 18, 0.55); border: 1px solid rgba(220, 230, 200, 0.35); border-radius: 4px; image-rendering: pixelated; touch-action: none; }
    /* R019 生產列：貼在提示列上方（bottom 由 src/ui/production.ts 設定） */
    #prodbar { left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); bottom: 52px; flex-wrap: wrap; background: rgba(28, 34, 26, 0.86); border: 1px solid #6c745f; }
    #prodbar[hidden] { display: none; }
    #prodbar button { min-height: 44px; min-width: 64px; padding: 0 10px; }
    #prodbar button b { margin-left: 4px; color: #ffd36a; font-weight: 800; }
    #prodbar button.dim { opacity: 0.45; }
    @media (max-width: 560px) { #prodbar button { min-width: 0; padding: 0 7px; font-size: 13px; } }   /* R022 七顆按鈕：手機上排緊一點 */
    #prodbar .info { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; margin-left: auto; }
    #prodbar.production-countdown #pb-countdown { flex-basis: 100%; min-width: 0; overflow-wrap: anywhere; font-size: 12px; line-height: 1.4; color: #d9e8bf; }
    #prodbar #pb-countdown[hidden] { display: none; }
    #prodbar #pb-reason { flex-basis: 100%; min-width: 0; overflow-wrap: anywhere; font-size: 12px; line-height: 1.4; color: #ffd36a; }
    #prodbar #pb-reason[hidden] { display: none; }
    #prodbar #pb-hq { flex-basis: 100%; min-width: 0; overflow-wrap: anywhere; font-size: 12px; line-height: 1.4; color: #d9e8bf; }
    #prodbar #pb-hq[hidden] { display: none; }
    #prodbar #pb-prog { display: inline-block; width: 48px; height: 6px; background: #3a4352; border-radius: 3px; overflow: hidden; margin-left: 6px; }
    #prodbar #pb-prog i { display: block; height: 100%; width: 0; background: #8cd06a; }
    @media (max-width: 640px) { #minimap { top: calc(max(8px, env(safe-area-inset-top)) + 100px); } }
    /* R016 開戰大字：不擋點擊 */
    #start-banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap; font-size: clamp(44px, 14vw, 72px); font-weight: 900; letter-spacing: 0.25em;
      color: #f6dc8c; text-shadow: 0 0 18px rgba(255, 150, 40, 0.75), 0 3px 0 #5a2a12; animation: gtrts-start 1.25s ease-out forwards; }
    @keyframes gtrts-start { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.96); } }
    /* R041 開戰命令條：取代上面的發光大字（?noR041=1 才用舊的）。沒有光暈、陰影字、漸層；不吃點擊；約 2.8 秒（src/ui/startOrder.ts） */
    #start-order { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); box-sizing: border-box; width: min(86vw, 340px); padding: 10px 14px 11px;
      pointer-events: none; background: rgba(22, 25, 20, 0.9); border: 1px solid #6c745f; border-left: 3px solid #9a4a2e; border-radius: 4px; color: #f3eedf;
      animation: gtrts-order 2.8s ease-out forwards; }
    #start-order p { margin: 0; }
    #start-order .so-place { font-size: 12px; color: #b9b29e; }
    #start-order .so-title { margin-top: 3px; font-size: 18px; font-weight: 700; }
    #start-order .so-goal { margin-top: 2px; font-size: 13px; color: #ded4c0; }
    @keyframes gtrts-order { 0% { opacity: 0; transform: translate(-50%, -6px); } 7% { opacity: 1; transform: translate(-50%, 0); } 86% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }
    @keyframes gtrts-order-still { 0% { opacity: 0; } 7% { opacity: 1; } 86% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #start-order { animation-name: gtrts-order-still; } }
    @media (max-width: 640px) { #hud .top { gap: 8px; font-size: 12px; } #hud .title small { display: none; }
      #hud .top { top: calc(max(8px, env(safe-area-inset-top)) + 60px); } }
    /* R124：360px 實測舊八鍵列裁掉暫停；只在新資訊啟用且不足 412px 時換行。
       412px／桌機保持原樣，noR124 完整還原舊排版，44px 命中區不縮小。 */
    @media (max-width: 411px) {
      #hud.cover-durability .btns { left: max(8px, env(safe-area-inset-left)); flex-wrap: wrap; justify-content: flex-end; }
      #hud.cover-durability .top { top: calc(max(8px, env(safe-area-inset-top)) + 108px); }
      #hud.cover-durability #minimap { top: calc(max(8px, env(safe-area-inset-top)) + 148px); }
    }
    /* R040 載入畫面：排在程式碼前面先畫（vite.config.ts 把 module 腳本搬到 body 尾巴）。
       動畫只動 transform／opacity：主執行緒忙著解析程式時照樣動。不吃點擊；初始化做完由 main.ts 拿掉。 */
    #loader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      background: #2a3329; color: #e9e2cf; pointer-events: none; text-align: center; padding: 0 16px; }
    #loader .ld-scene { position: relative; width: 220px; height: 64px; overflow: hidden; margin-bottom: 10px; }
    #loader .ld-road { position: absolute; left: 0; bottom: 6px; width: 440px; height: 4px; background: repeating-linear-gradient(90deg, #6b5440 0 12px, transparent 12px 20px); animation: ld-road .5s linear infinite; }
    #loader .ld-tank { position: absolute; left: 62px; bottom: 10px; width: 96px; height: 48px; image-rendering: pixelated; shape-rendering: crispEdges; animation: ld-bob .36s steps(2) infinite; }
    #loader .ld-puff { position: absolute; left: 60px; bottom: 30px; width: 6px; height: 6px; background: #8f8b85; opacity: 0; animation: ld-puff 1.2s linear infinite; }
    #loader .ld-puff:nth-of-type(2) { animation-delay: .4s; }
    #loader .ld-puff:nth-of-type(3) { animation-delay: .8s; }
    #loader .ld-title { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .06em; }
    #loader .ld-sub { margin: 0; font-size: 12px; color: #b9b29e; }
    #loader .ld-msg { margin: 6px 0 0; font-size: 13px; color: #d9d2bd; max-width: 360px; overflow-wrap: anywhere; }
    #loader.fail .ld-msg { color: #f0a483; }
    #loader.fail .ld-scene * { animation: none; }
    @keyframes ld-road { to { transform: translateX(-20px); } }
    @keyframes ld-bob { 50% { transform: translateY(-1px); } }
    @keyframes ld-puff { 0% { opacity: .75; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(-28px, -14px) scale(2.2); } }
    @media (prefers-reduced-motion: reduce) { #loader .ld-scene * { animation: none; } }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <div class="ld-scene" aria-hidden="true">
      <div class="ld-road"></div>
      <span class="ld-puff"></span><span class="ld-puff"></span><span class="ld-puff"></span>
      <svg class="ld-tank" viewBox="0 0 32 16">
        <rect x="21" y="4" width="10" height="2" fill="#3c4526"/>
        <rect x="11" y="3" width="10" height="4" fill="#6b7a44"/>
        <rect x="13" y="2" width="4" height="1" fill="#4a5530"/>
        <rect x="5" y="7" width="22" height="3" fill="#5d6b3a"/>
        <rect x="5" y="7" width="22" height="1" fill="#77824a"/>
        <rect x="3" y="10" width="26" height="4" fill="#2c2a26"/>
        <rect x="5" y="11" width="2" height="2" fill="#8a8f78"/><rect x="9" y="11" width="2" height="2" fill="#8a8f78"/>
        <rect x="13" y="11" width="2" height="2" fill="#8a8f78"/><rect x="17" y="11" width="2" height="2" fill="#8a8f78"/>
        <rect x="21" y="11" width="2" height="2" fill="#8a8f78"/><rect x="25" y="11" width="2" height="2" fill="#8a8f78"/>
      </svg>
    </div>
    <p class="ld-title">微光小鎮</p>
    <p class="ld-sub">二戰戰術 · 1940</p>
    <p class="ld-msg">正在整備戰場</p>
  </div>
  <script>
    // R040：?noR040=1＝不顯示載入畫面；程式準備好之前出錯（例如沒有 WebGL），把原因寫在載入畫面上，不留一片空白。
    (function () {
      var el = document.getElementById('loader');
      if (!el) return;
      if (/[?&]noR040=1(&|$)/.test(location.search)) { el.remove(); return; }
      var fail = function (why) {
        if (!document.getElementById('loader')) return;
        el.classList.add('fail');
        el.querySelector('.ld-msg').textContent = '載入失敗：' + (why || '未知錯誤') + '。請重新整理，或換一個支援 WebGL 的瀏覽器。';
      };
      addEventListener('error', function (e) { fail(e.message); });
      addEventListener('unhandledrejection', function (e) { fail(e.reason && e.reason.message); });
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
