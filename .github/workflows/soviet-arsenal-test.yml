name: Soviet arsenal test only
on:
  push:
    branches: ['gpt/soviet-arsenal-local']
permissions:
  contents: read
concurrency:
  group: soviet-arsenal-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck && npm run build
      - name: Arsenal simulation and interface guards
        run: node tests/soviet-arsenal.mjs && node tests/soviet-production-ui.mjs && node tests/production-layout.mjs && node tests/mobile-ui.mjs
      - name: Desktop and mobile browser verification
        run: node tests/soviet-arsenal-browser.mjs 2>&1 | tee soviet-browser.log; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soviet-arsenal-${{ github.sha }}
          path: |
            soviet-browser.log
            shots/soviet-*.png
          retention-days: 7
          if-no-files-found: warn
