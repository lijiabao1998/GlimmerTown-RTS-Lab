# 每次推送與 PR：Node 端守衛分四份並行（第 1 份另跑型別檢查）＋同時建置單檔、跑無頭 Chrome 煙霧測試（WebGL 走 SwiftShader）→ 樣張當附件。
# smoke 是總閘（R039）：四份 unit 與 chrome 都綠它才綠；分支保護、gpt-merge、AGENTS.md 說的「smoke 與 gpt-lane 都要綠」照舊看它。
# gpt/* 分支另跑 GPT 車道守衛（用 main 上的那一份）。main 綠燈之後把 dist/index.html 發到 GitHub Pages。
name: ci

on:
  push:
    branches: [main, 'claude/**', 'ccr-**']
  pull_request:
    branches: [main]   # 只有要進 main 的 PR 才跑；PR 改目標分支（edited）會重跑
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # R039：90 支守衛一支接一支跑已經 15 分鐘（上限 20），分四份並行；分法寫在 tools/unit.mjs（固定、跟機器無關）
  unit:
    name: unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 中文字型（瀏覽器守衛量版面、拍樣張要用）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - if: matrix.shard == 1
        run: npm run typecheck
      - name: Node 端守衛（第 1 份另跑純度、決定性、黃金雜湊、模擬行為）
        run: npm run unit 2>&1 | tee unit-run.txt; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          UNIT_SHARD: ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.shard }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            unit-run.txt
            shots/*.png
          if-no-files-found: warn
          retention-days: 14

  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 中文字型（樣張上的 HUD 才看得懂）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: 煙霧測試（預算、Node＝Chrome 雜湊、觸控、逃生閥）
        run: node tools/smoke.mjs 2>&1 | tee smoke-run.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            smoke-run.txt
            shots/*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  # 總閘：名字沿用 smoke（分支保護與合併條件看它）。四份 unit 與 chrome 都是 success 才綠；有一個紅、被跳過或取消就紅
  smoke:
    if: ${{ !cancelled() }}
    needs: [unit, chrome]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: unit 四份與 chrome 都要綠
        env:
          UNIT: ${{ needs.unit.result }}
          CHROME: ${{ needs.chrome.result }}
        run: |
          echo "unit=$UNIT chrome=$CHROME"
          test "$UNIT" = success && test "$CHROME" = success

  gpt-lane:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'gpt/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: GPT 車道守衛（main 上的那一份）
        env:
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin main
          git show origin/main:tools/gpt-lane.mjs > "$RUNNER_TEMP/gpt-lane.mjs"
          BASE=origin/main HEAD_REF="$HEAD_SHA" node "$RUNNER_TEMP/gpt-lane.mjs"

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
