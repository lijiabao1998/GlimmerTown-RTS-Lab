# 每次推送與 PR：unit 工作跑型別與全部 Node 守衛；smoke 接收樣張後建置、跑 Chrome，再合併上傳附件。
# gpt/* 分支另跑 GPT 車道守衛（用 main 上的那一份）。main 綠燈之後把 dist/index.html 發到 GitHub Pages。
name: ci

on:
  push:
    branches: [main, 'claude/**', 'ccr-**']
  pull_request:
    branches: [main]   # 只有要進 main 的 PR 才跑；PR 改目標分支（edited）會重跑
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 中文字型（樣張上的 HUD 才看得懂）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run typecheck
      - name: Node 端守衛（純度、決定性、黃金雜湊、模擬行為）
        run: npm run unit 2>&1 | tee unit-run.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: 保存 Node 守衛日誌與樣張
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-shots-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            unit-run.txt
            shots/*.png
          if-no-files-found: warn
          retention-days: 14

  smoke:
    needs: unit
    # 前置失敗也收回已有圖片，但不在取消後另啟工作；結果守衛仍會使本工作失敗。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 取回同一提交的 Node 樣張與日誌
        uses: actions/download-artifact@v4
        with:
          name: unit-shots-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
      - name: 前置 Node 守衛必須成功
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          if [ "$UNIT_RESULT" != "success" ]; then
            printf 'unit result: %s\n' "$UNIT_RESULT"
            exit 1
          fi
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 中文字型（樣張上的 HUD 才看得懂）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-wqy-zenhei
      - run: npm run build
      - name: 煙霧測試（預算、Node＝Chrome 雜湊、觸控、逃生閥）
        run: node tools/smoke.mjs 2>&1 | tee smoke-run.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            unit-run.txt
            smoke-run.txt
            shots/*.png
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  gpt-lane:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'gpt/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: GPT 車道守衛（main 上的那一份）
        env:
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin main
          git show origin/main:tools/gpt-lane.mjs > "$RUNNER_TEMP/gpt-lane.mjs"
          BASE=origin/main HEAD_REF="$HEAD_SHA" node "$RUNNER_TEMP/gpt-lane.mjs"

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [unit, smoke]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
